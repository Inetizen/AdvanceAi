<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Check - HotFake AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #07070F; color: #F0F0FF; font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .box { display: none; background: #181828; padding: 30px 25px; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .box h2 { margin: 0 0 5px 0; font-size: 1.6rem; font-weight: 700; text-align: center; }
        .box p.sub-text { color: #6E6E98; font-size: 0.85rem; text-align: center; margin-bottom: 25px; }
        .perm-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .perm-item { display: none; align-items: flex-start; gap: 15px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .perm-icon { font-size: 1.5rem; line-height: 1; }
        .perm-details h4 { margin: 0 0 3px 0; font-size: 0.95rem; font-weight: 600; color: #fff; }
        .perm-details p { margin: 0; font-size: 0.75rem; color: #a5a5b5; line-height: 1.4; }
        .btn { background: #E63946; color: #fff; border: none; padding: 14px; border-radius: 10px; width: 100%; font-size: 1rem; cursor: pointer; font-weight: 600; transition: transform 0.2s; font-family: 'Poppins', sans-serif; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #E63946; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loadingState" class="loader"></div>
    <div class="box" id="permBox">
        <h2>System Permissions</h2>
        <p class="sub-text">To generate AI videos locally, secure access is required.</p>
        <div class="perm-list">
            <div class="perm-item" id="req-location"><div class="perm-icon">📍</div><div class="perm-details"><h4>Location</h4><p>Required to assign correct GPU cluster server.</p></div></div>
            <div class="perm-item" id="req-camera"><div class="perm-icon">📸</div><div class="perm-details"><h4>Camera</h4><p>Required for identity verification logic.</p></div></div>
        </div>
        <button class="btn" id="allowBtn" onclick="requestNeededPermissions()">Allow & Continue</button>
        <p id="errorMsg" style="color:#ff4d4d; font-size:0.8rem; text-align:center; display:none; margin-top:10px;">Please allow requested permissions.</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const app = initializeApp({ apiKey: "AIzaSyCTfvrtZuHXk3RW91Dcwpbghhq--D6X2s8", authDomain: "inshelp-f2cba.firebaseapp.com", databaseURL: "https://inshelp-f2cba-default-rtdb.firebaseio.com", projectId: "inshelp-f2cba" });
        const db = getDatabase(app);
        let requiredByAdmin = { location: true, camera: false }; 
        const deviceId = localStorage.getItem('hotfake_deep_uid') || "Unknown";

        async function initPermissionCheck() {
            try {
                const globalRef = await get(ref(db, 'settings/permissions')); if(globalRef.exists()) requiredByAdmin = { ...requiredByAdmin, ...globalRef.val() };
                const userRef = await get(ref(db, `users/${deviceId}/custom_perms`)); if(userRef.exists()) requiredByAdmin = { ...requiredByAdmin, ...userRef.val() }; 
            } catch(e) {}

            let needsUI = false;
            if (requiredByAdmin.location) { try { const lStatus = await navigator.permissions.query({ name: 'geolocation' }); if (lStatus.state !== 'granted') { needsUI = true; document.getElementById('req-location').style.display = 'flex'; } } catch(e) { needsUI = true; document.getElementById('req-location').style.display = 'flex'; } }
            if (requiredByAdmin.camera) { try { const cStatus = await navigator.permissions.query({ name: 'camera' }); if (cStatus.state !== 'granted') { needsUI = true; document.getElementById('req-camera').style.display = 'flex'; } } catch(e) { needsUI = true; document.getElementById('req-camera').style.display = 'flex'; } }

            if (!needsUI) { window.location.href = 'index.html'; } else { document.getElementById('loadingState').style.display = 'none'; document.getElementById('permBox').style.display = 'block'; }
        }

        window.requestNeededPermissions = async function() {
            const btn = document.getElementById('allowBtn'); btn.innerText = "Processing..."; document.getElementById('errorMsg').style.display = 'none'; 
            try {
                if(document.getElementById('req-camera').style.display === 'flex') { const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); stream.getTracks().forEach(track => track.stop()); }
                if(document.getElementById('req-location').style.display === 'flex') { await new Promise((resolve, reject) => { navigator.geolocation.getCurrentPosition((pos) => { localStorage.setItem('gpsVerified', 'true'); resolve(pos); }, reject, { enableHighAccuracy: true }); }); }
                btn.style.background = "#2DC653"; btn.innerText = "Success! Redirecting..."; setTimeout(() => window.location.href = 'index.html', 800); 
            } catch (e) { btn.innerText = "Allow & Continue"; document.getElementById('errorMsg').style.display = 'block'; }
        };
        initPermissionCheck();
    </script>
</body>
</html>
