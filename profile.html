<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saved AI Videos - HotFake</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #07070F; color: #F0F0FF; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.07); padding-bottom: 15px; }
        .header h2 { margin: 0; font-size: 1.5rem; font-weight: 700; color: #E63946;}
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: #181828; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.07); }
        .card-body { padding: 12px; }
        .card-body h3 { font-size: 0.85rem; margin: 0 0 10px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .btn-group { display: flex; gap: 5px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.75rem; font-family: inherit;}
        .btn-play { background: #E63946; color: white; }
        .btn-del { background: rgba(255,255,255,0.1); color: white; }
        .empty-msg { text-align: center; color: rgba(255,255,255,0.5); margin-top: 50px; font-size: 0.9rem; grid-column: 1 / -1; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,15,28,0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.07); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #6E6E98; text-decoration: none; font-size: 0.7rem; font-weight: 500; gap: 4px; transition: color 0.2s;}
        .nav-item.active { color: #fff; }
    </style>
</head>
<body>

    <div class="header"><h2>Saved AI Videos</h2></div>
    <div id="contentGrid" class="grid"><div class="empty-msg">Loading saved videos...</div></div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Workspace</a>
        <a href="profile.html" class="nav-item active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Saved</a>
        <a href="contact-support.html" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>Device Auth</a>
    </div>

    <!-- SECURE PLAYER INSIDE PROFILE -->
    <div id="playerModal" style="display:none; position:fixed; inset:0; background:#000; z-index:9999; flex-direction:column;">
        <div style="flex:1; display:flex; justify-content:center; align-items:center; width:100vw; height:100vh; position:relative; background: #000;">
            <div style="position: absolute; inset: 0; z-index: 99; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none;">
                <div style="background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); height: 90px; display: flex; align-items: flex-start; padding: 15px 20px; pointer-events: auto;">
                    <button style="background: rgba(255,255,255,0.15); color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; border:none;" onclick="closePlayer()">⬅</button>
                    <span style="color: white; margin-left: 15px; font-weight: 500; font-size: 1.1rem; margin-top:8px;">AI Video Player</span>
                </div>
            </div>
            <video id="nativePlayer" controls playsinline style="width:100%; height:100%; z-index: 2; background:#000; display:none;"></video>
            <iframe id="iframePlayer" allowfullscreen style="width:100%; height:100%; border:none; z-index:1; display:none;"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAI3ysLR_LFnG5dw2SY8AwF1ldGgc43ywE",
            authDomain: "ai-studio-b0c87.firebaseapp.com",
            databaseURL: "https://ai-studio-b0c87-default-rtdb.firebaseio.com",
            projectId: "ai-studio-b0c87",
            storageBucket: "ai-studio-b0c87.firebasestorage.app",
            messagingSenderId: "699632892927",
            appId: "1:699632892927:web:3d38f396c8897a36e885ca"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let deviceId = localStorage.getItem('hotfake_deep_uid');

        if (deviceId) {
            loadSavedVideos(deviceId);
        } else {
            document.getElementById('contentGrid').innerHTML = `<div class='empty-msg'>Error: Device not recognized.</div>`;
        }

        function loadSavedVideos(dId) {
            onValue(ref(db, 'ai_requests'), (snap) => {
                const contentGrid = document.getElementById('contentGrid');
                contentGrid.innerHTML = '';
                const data = snap.val();
                let hasItems = false;
                
                if (data) {
                    Object.keys(data).reverse().forEach(k => {
                        const req = data[k];
                        if (req.deviceId === dId && req.status === 'completed' && req.userHidden !== true) {
                            hasItems = true;
                            const title = req.prompt ? `"${req.prompt.substring(0,40)}..."` : "AI Generated Video";
                            const imgHtml = req.imageUrl && req.imageUrl !== "uploading" 
                                ? `<img src="${req.imageUrl}" style="width: 100%; aspect-ratio: 16/9; object-fit: cover;">` 
                                : `<div style="width: 100%; aspect-ratio: 16/9; background: #222; display: flex; align-items: center; justify-content: center; color: #6E6E98; font-size: 2rem;">▶</div>`;
                            
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                ${imgHtml}
                                <div class="card-body">
                                    <h3>${title}</h3>
                                    <div class="btn-group">
                                        <button class="btn btn-play" onclick="playVideo('${req.videoUrl}')">Play</button>
                                        <button class="btn btn-del" onclick="deleteItem('${k}')">Remove</button>
                                    </div>
                                </div>`;
                            contentGrid.appendChild(card);
                        }
                    });
                }
                if (!hasItems) {
                    contentGrid.innerHTML = `<div class='empty-msg'>No saved videos found.</div>`;
                }
            });
        }

        window.deleteItem = (itemId) => {
            if (confirm("Are you sure you want to remove this?")) {
                update(ref(db, `ai_requests/${itemId}`), { userHidden: true });
            }
        };

        window.playVideo = (url) => {
            document.getElementById('playerModal').style.display = 'flex';
            const nativeP = document.getElementById('nativePlayer'); 
            const iframeP = document.getElementById('iframePlayer');
            if (url.match(/\.(mp4|m3u8)$/i) || url.includes('.mp4?') || url.startsWith('blob:')) {
                iframeP.style.display = 'none'; nativeP.style.display = 'block'; nativeP.src = url; nativeP.play();
            } else { 
                nativeP.style.display = 'none'; iframeP.style.display = 'block'; iframeP.src = url; 
            }
        };

        window.closePlayer = () => {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('nativePlayer').pause(); 
            document.getElementById('nativePlayer').src = ''; 
            document.getElementById('iframePlayer').src = '';
        };
    </script>
</body>
</html>
