<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#07070F">
    <title>Generate History - HotFake AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #07070F; --surf: #0F0F1C; --surf2: #181828; --red: #E63946; --red-glow: rgba(230,57,70,0.3); --green: #2DC653; --text: #F0F0FF; --muted: #6E6E98; --border: rgba(255,255,255,0.07); }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        /* Premium Header Styling */
        header { background: rgba(7,7,15,0.88); backdrop-filter: blur(18px); padding: 1.2rem; border-bottom: 1px solid var(--border); position: sticky; top:0; z-index: 100; text-align: center; }
        h2 { margin: 0; font-size: 1.35rem; color: #fff; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        h2 .highlight { color: var(--red); }
        
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        /* Premium Card Styling */
        .vid-card { background: var(--surf2); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .vid-card:hover { transform: translateY(-3px); border-color: rgba(230,57,70,0.3); box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
        
        .vid-thumb { height: 110px; background: linear-gradient(145deg, #11111d, #1a1a2e); display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 1px solid var(--border); }
        
        .vid-info { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .vid-title { font-size: 0.9rem; color: #fff; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vid-time { font-size: 0.7rem; color: var(--muted); margin-bottom: 15px; font-family: monospace; }
        
        /* Improved Buttons Layout */
        .action-row { display: flex; gap: 10px; margin-bottom: 10px; }
        
        .btn-play { flex: 1; background: var(--red); color: #fff; border: none; padding: 10px 0; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 4px 15px var(--red-glow); font-family: 'Poppins', sans-serif; transition: 0.2s; }
        .btn-play:hover { background: #ff4754; }
        
        /* Icon-Only Download Button */
        .btn-down { width: 42px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s; }
        .btn-down:hover { background: rgba(45,198,83,0.15); border-color: var(--green); color: var(--green); }
        
        .btn-del { width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.08); color: var(--muted); padding: 8px 0; border-radius: 8px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: 0.2s; font-family: 'Poppins', sans-serif;}
        .btn-del:hover { background: rgba(230,57,70,0.1); color: var(--red); border-color: rgba(230,57,70,0.3); }
        
        .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.95rem; }
        
        /* Modal Video Player Styling */
        #playerModal { display:none; position:fixed; inset:0; background:#000; z-index:9999; flex-direction:column; touch-action: none !important;}
        .player-wrapper { flex:1; display:flex; justify-content:center; align-items:center; width:100vw; height:100vh; position:relative; background: #000; }
        #iframePlayer { width: 100%; height: 100%; border: none; z-index: 1; display:none; }
        #nativePlayer { width: 100%; height: 100%; z-index: 2; background:#000; display:none; }
        #nativeImagePlayer { display:none; max-width:100%; max-height:100%; object-fit:contain; z-index:2; position:relative; }
        
        .smart-overlay { position: absolute; inset: 0; z-index: 99; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .glass-top { background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); height: 90px; display: flex; align-items: flex-start; padding: 15px 20px; pointer-events: auto; }
        .ui-back-btn { background: rgba(255,255,255,0.15); color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; display: flex; justify-content: center; align-items: center; cursor: pointer; border:none;}

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,15,28,0.95); backdrop-filter: blur(15px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); text-decoration: none; font-size: 0.7rem; font-weight: 500; gap: 4px; }
        .nav-item.active { color: #fff; }
    </style>
</head>
<body>

<header>
    <h2>✨ Generate <span class="highlight">History</span></h2>
</header>

<div class="container">
    <div class="grid" id="videoGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
        <div style="font-size: 3rem; margin-bottom: 10px;">📭</div>
        You haven't generated any media yet.
    </div>
</div>

<!-- SMART MEDIA PLAYER -->
<div id="playerModal">
  <div class="player-wrapper">
       <div class="smart-overlay">
           <div class="glass-top">
               <div style="display:flex; align-items:center;">
                   <button class="ui-back-btn" onclick="closePlayer()">⬅</button>
                   <span style="margin-left:15px; color:white; font-weight:bold; font-size: 0.95rem;">Playback</span>
               </div>
           </div>
       </div>
       <video id="nativePlayer" controls playsinline></video>
       <img id="nativeImagePlayer" alt="AI Generated Output">
       <iframe id="iframePlayer" allowfullscreen></iframe>
  </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Generate</a>
    <a href="profile.html" class="nav-item active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Saved</a>
    <a href="contact-support.html" class="nav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>Auth</a>
</div>

<script>
    function loadVideos() {
        const grid = document.getElementById('videoGrid');
        const emptyState = document.getElementById('emptyState');
        const vids = JSON.parse(localStorage.getItem('my_ai_videos') || '[]');
        
        grid.innerHTML = '';
        
        // Filter out items where the URL is empty (Still processing/error)
        const completedVids = vids.filter(v => v.url && v.url.trim() !== "");

        if(completedVids.length === 0) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';
            // Show newest first
            completedVids.reverse().forEach((v, idx) => {
                const originalIndex = vids.findIndex(orig => orig.id === v.id);
                
                grid.innerHTML += `
                    <div class="vid-card">
                        <div class="vid-thumb">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                        </div>
                        <div class="vid-info">
                            <div>
                                <div class="vid-title">"${v.title}"</div>
                                <div class="vid-time">${new Date(v.timestamp).toLocaleString()}</div>
                            </div>
                            <div class="action-row">
                                <button class="btn-play" onclick="playVid('${v.url}')">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Play
                                </button>
                                <a href="${v.url}" download="HotFake_AI_Export" class="btn-down" title="Download">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                </a>
                            </div>
                            <button class="btn-del" onclick="removeVid(${originalIndex})">Remove Item</button>
                        </div>
                    </div>
                `;
            });
        }
    }

    window.removeVid = (index) => {
        if(confirm("Remove this item from your generated history?")) {
            let vids = JSON.parse(localStorage.getItem('my_ai_videos') || '[]');
            vids.splice(index, 1);
            localStorage.setItem('my_ai_videos', JSON.stringify(vids));
            loadVideos(); 
        }
    };

    window.playVid = (url) => {
        document.body.style.overflow = 'hidden'; 
        document.getElementById('playerModal').style.display = 'flex';
        
        const nativeP = document.getElementById('nativePlayer'); 
        const iframeP = document.getElementById('iframePlayer');
        const nativeImg = document.getElementById('nativeImagePlayer');
        
        nativeP.style.display = 'none'; iframeP.style.display = 'none'; nativeImg.style.display = 'none';

        if (url.startsWith('data:image') || url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
            nativeImg.style.display = 'block'; nativeImg.src = url;
        } else if (url.startsWith('data:video') || url.match(/\.(mp4|m3u8|webm)$/i) || url.includes('.mp4?')) {
            nativeP.style.display = 'block'; nativeP.src = url; nativeP.play().catch(e=>{});
        } else {
            iframeP.style.display = 'block'; iframeP.src = url;
        }
    };

    window.closePlayer = () => {
        document.getElementById('playerModal').style.display = 'none'; 
        document.body.style.overflow = '';
        document.getElementById('nativePlayer').pause(); 
        document.getElementById('nativePlayer').src = ''; 
        document.getElementById('iframePlayer').src = '';
        document.getElementById('nativeImagePlayer').src = '';
    };

    loadVideos();
</script>
</body>
</html>
